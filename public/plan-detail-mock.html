<title>상품 상세 시안</title>
<style>
:root{--cs:#582681;--line:#ececf0;--ink:#2b2b2e;--sub:#8a8a90}
*{box-sizing:border-box}
body{font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#f4f4f6;margin:0;padding:26px;color:#555;-webkit-font-smoothing:antialiased}
.page{max-width:760px;margin:0 auto;background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(30,25,20,.05);overflow:hidden}
.pane{padding:26px 30px 0}
.crumb{font-size:13px;color:var(--sub);margin:0 0 14px}
.tag{display:inline-block;background:#f1ebf8;color:var(--cs);border-radius:100px;padding:3px 11px;font-size:11.5px;font-weight:700}
.nm{font-size:28px;font-weight:700;color:var(--ink);margin:11px 0 7px;letter-spacing:-.6px}
.ln{font-size:15.5px;color:#555;margin:0;line-height:1.55}

/* 히어로 + 이벤트 */
.evt{display:flex;align-items:center;gap:9px;background:var(--cs);color:#fff;border-radius:12px 12px 0 0;
  padding:11px 18px;font-size:13.5px;font-weight:600;margin:20px 0 0}
.evt b{background:rgba(255,255,255,.22);border-radius:100px;padding:2px 10px;font-size:12px}
.hero{display:flex;gap:20px;align-items:flex-end;justify-content:space-between;
  background:linear-gradient(103deg,#f7f4fe 0%,#fdf2f8 100%);border:1px solid #e7e0f5;border-top:0;
  border-radius:0 0 12px 12px;padding:20px 22px}
.hero .p{font-size:34px;font-weight:800;color:var(--ink);letter-spacing:-1.4px;line-height:1;margin:0}
.hero .p i{font-size:17px;font-style:normal;font-weight:700}
.hero .was{font-size:13px;color:var(--sub);text-decoration:line-through;margin:0 0 5px}
.hero .pd{font-size:12.5px;color:var(--sub);margin:8px 0 0}
.cta{display:inline-flex;align-items:center;gap:6px;height:50px;padding:0 26px;border-radius:10px;
  background:var(--cs);color:#fff;font-size:15.5px;font-weight:700;text-decoration:none;white-space:nowrap;
  box-shadow:0 6px 16px rgba(88,38,129,.24)}
.trust{display:flex;flex-wrap:wrap;gap:7px 16px;margin:13px 0 0;font-size:12.5px;color:var(--sub)}
.trust span{display:inline-flex;align-items:center;gap:5px}
.trust i{font-style:normal;color:#5aa06f;font-weight:800}

.sec{margin:34px 0 0}
.h{font-size:17px;font-weight:700;color:var(--ink);margin:0 0 6px;letter-spacing:-.3px}
.hs{font-size:13.5px;color:var(--sub);margin:0 0 16px;line-height:1.55}

/* 하는 일 */
.do{display:grid;grid-template-columns:1fr 216px;gap:20px;align-items:center;
  border:1px solid var(--line);border-radius:13px;padding:18px;margin-bottom:11px}
.do .n{font-size:11px;font-weight:800;color:var(--cs);margin:0 0 5px}
.do .t{font-size:16px;font-weight:700;color:var(--ink);margin:0 0 7px;letter-spacing:-.3px;line-height:1.4}
.do .d{font-size:13.5px;color:#555;margin:0;line-height:1.65;word-break:keep-all}
.res{display:inline-block;margin-top:9px;font-size:12.5px;color:var(--cs);background:#f7f4fe;
  border-radius:7px;padding:6px 10px;line-height:1.5;font-weight:600;word-break:keep-all}
.shot{background:#fafafb;border:1px solid var(--line);border-radius:10px;padding:12px}

/* 그림 부품 */
.tl{display:flex;flex-direction:column;gap:6px}
.tlrow{display:flex;align-items:center;gap:6px;font-size:9.5px;color:var(--sub)}
.tlrow .lb{width:32px;flex:none}
.bar{height:11px;border-radius:3px;flex:1;background:linear-gradient(90deg,var(--cs),#8654b5)}
.tlax{display:flex;justify-content:space-between;font-size:9px;color:#c0c0c6;margin-top:3px}
.stack{display:flex;flex-direction:column;gap:5px}
.jc{display:flex;gap:7px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px}
.jc .th{width:26px;height:20px;border-radius:4px;background:#ece7f4;flex:none}
.jc .l2{flex:1}.jc .l2 span{display:block;height:4px;border-radius:2px;background:#e6e6ea}
.jc .l2 span+span{margin-top:3px;width:55%}
.plus{text-align:center;font-size:10.5px;color:var(--cs);font-weight:700;padding-top:2px}
.tal{display:flex;flex-direction:column;gap:6px}
.tcard{display:flex;gap:7px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:7px;padding:7px 8px}
.tcard .av{width:22px;height:22px;border-radius:50%;background:#ece7f4;flex:none}
.tcard .n2{font-size:10.5px;color:#b0b0b6}.tcard .ph{font-size:9.5px;color:#c8c8ce;margin-top:1px}
.tcard.open{border-color:var(--cs)}.tcard.open .n2{color:var(--ink);font-weight:700}
.tcard.open .ph{color:var(--cs);font-weight:600}
.bub{background:var(--cs);color:#fff;border-radius:9px 9px 9px 2px;padding:7px 9px;font-size:10px;line-height:1.45}
.srch{display:flex;flex-direction:column;gap:5px}
.sr{height:22px;border-radius:5px;background:#f2f2f5;display:flex;align-items:center;padding:0 7px;font-size:9.5px;color:#b8b8be}
.sr.me{background:#fff;border:1.5px solid var(--cs);color:var(--ink);font-weight:700}
.cells{display:grid;gap:5px}
.cell{height:26px;border-radius:5px;background:#f2f2f5;border:1px solid var(--line)}
.cell.on{background:#f1ebf8;border-color:var(--cs)}

/* 이런 곳에 맞습니다 */
.fit{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fitbox{border:1px solid var(--line);border-radius:12px;padding:16px 17px}
.fitbox.yes{border-color:#cfe4d6;background:#fbfdfc}
.fitbox .ft{font-size:13.5px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:6px}
.fitbox.yes .ft{color:#3f8a5c}.fitbox.no .ft{color:var(--sub)}
.fitbox ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.fitbox li{font-size:13px;line-height:1.55;color:#555;word-break:keep-all;padding-left:12px;position:relative}
.fitbox li::before{content:"";position:absolute;left:0;top:8px;width:4px;height:4px;border-radius:50%;background:#c8c8ce}
.fitbox.yes li::before{background:#5aa06f}
.fitbox .go{display:inline-block;margin-top:11px;font-size:12.5px;color:var(--cs);font-weight:700;text-decoration:none}

/* 받는 것 */
.feat{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
.feat li{font-size:14px;color:#555;display:flex;gap:8px;align-items:flex-start;line-height:1.5}
.feat li::before{content:"✓";color:#c8c8ce;font-weight:800;font-size:12px;margin-top:2px}

/* 어떻게 되나 */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.step{border:1px solid var(--line);border-radius:11px;padding:14px 13px;position:relative}
.step .sn{width:20px;height:20px;border-radius:50%;background:var(--cs);color:#fff;font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;margin-bottom:9px}
.step .st{font-size:13.5px;font-weight:700;color:var(--ink);margin:0 0 4px}
.step .sd{font-size:12px;color:var(--sub);margin:0;line-height:1.5;word-break:keep-all}

/* 기간 */
.plist{display:flex;flex-direction:column;gap:7px}
.pitem{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.pitem.best{border-color:var(--cs);background:#faf7fe}
.pitem .l{display:flex;align-items:center;gap:8px}
.pitem .l b{color:var(--ink);font-weight:700;font-size:15px}
.bb{background:var(--cs);color:#fff;border-radius:100px;padding:2px 9px;font-size:10.5px;font-weight:700}
.pitem .r{text-align:right}.pitem .r b{display:block;color:var(--ink);font-weight:700;font-size:15px}
.pitem .r i{font-style:normal;font-size:11.5px;color:var(--sub)}

/* 묻는 말 */
.qa{border-top:1px solid var(--line)}
.qa dl{margin:0}
.qa dt{font-size:14px;font-weight:700;color:var(--ink);padding:15px 0 0}
.qa dd{margin:6px 0 0;padding:0 0 15px;font-size:13.5px;color:#555;line-height:1.7;border-bottom:1px solid #f4f4f6;word-break:keep-all}

.stick{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 38%);
  padding:20px 30px 24px;margin-top:20px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-top:1px solid var(--line)}
.stick .s{font-size:13px;color:var(--sub)}
.stick .s b{display:block;color:var(--cs);font-size:16.5px;font-weight:800}
</style>
<div class="page" id="p"></div>
<script>
const 타임라인 = `<div class="tl">${[1,2,3].map(i=>`<div class="tlrow"><span class="lb">공고${i}</span><span class="bar"></span></div>`).join('')}
  <div class="tlax"><span>신청일</span><span>기간 끝</span></div></div>`;
const 쌓기 = `<div class="stack">${[1,2,3].map(()=>`<span class="jc"><span class="th"></span><span class="l2"><span></span><span></span></span></span>`).join('')}<span class="plus">+ 몇 건이든</span></div>`;
const 검색 = `<div class="srch">
  <span class="sr">프리미엄 · 최상단</span><span class="sr">스탠다드 · 상단</span>
  <span class="sr me">라이트 · 일반</span><span class="sr">스타트 · 하단</span></div>`;

document.getElementById('p').innerHTML = `
<div class="pane">
  <p class="crumb">← 요금제</p>
  <span class="tag">공고를 걸어두는 상품</span>
  <p class="nm">라이트</p>
  <p class="ln">공고등록을 무제한으로 올릴 수 있어요</p>

  <div class="evt">🎁 10월 오픈 기념 <b>선착순 1개월 무료</b> · 지금 신청하면 첫 달 값이 들지 않습니다</div>
  <div class="hero">
    <div>
      <p class="was">30일 49,000원</p>
      <p class="p">0<i>원</i></p>
      <p class="pd">선착순 1개월 무료 · 이후 30일 49,000원 · 부가세 포함</p>
    </div>
    <a class="cta" href="#">라이트 신청하기 →</a>
  </div>
  <div class="trust">
    <span><i>✓</i>자동 결제 없습니다</span>
    <span><i>✓</i>안 쓰셨으면 7일 안에 전액 환불</span>
    <span><i>✓</i>세금계산서 발행</span>
  </div>

  <div class="sec">
    <p class="h">라이트가 하는 일</p>
    <p class="hs">공고를 <b>올려 두는 일</b>을 맡습니다. 매주 다시 올리지 않아도 됩니다.</p>
    <div class="do">
      <div><p class="n">01</p><p class="t">올린 공고가 끝까지 걸려 있습니다</p>
        <p class="d">한 번 올리면 이용권 기간 내내 목록에 남습니다. 무료는 30일 체험이 끝나면 함께 내려가지만, 라이트는 산 기간만큼 그대로 걸려 있습니다.</p>
        <span class="res">구직자는 매일 새로 들어옵니다. 공고가 계속 걸려 있어야 그 사람들을 만납니다</span></div>
      <div class="shot">${타임라인}</div>
    </div>
    <div class="do">
      <div><p class="n">02</p><p class="t">자리마다 따로, 몇 건이든</p>
        <p class="d">헤어 디자이너와 네일 아티스트를 한 장에 몰아 적지 않아도 됩니다. 자리별로 나눠 올리면 각 직군을 찾는 사람에게만 뜹니다.</p>
        <span class="res">직군을 골라 보는 사람에게 정확히 걸립니다</span></div>
      <div class="shot">${쌓기}</div>
    </div>
    <div class="do">
      <div><p class="n">03</p><p class="t">검색 결과 일반 노출</p>
        <p class="d">무료(스타트)는 목록 아래쪽에 섭니다. 라이트부터 일반 노출로 올라옵니다. 더 위로 가려면 스탠다드·프리미엄입니다.</p></div>
      <div class="shot">${검색}</div>
    </div>
  </div>

  <div class="sec">
    <p class="h">이런 매장에 맞습니다</p>
    <div class="fit">
      <div class="fitbox yes"><p class="ft">✓ 라이트로 충분합니다</p>
        <ul><li>상시 채용이라 공고를 계속 걸어 두고 싶다</li>
        <li>지원자를 기다려 받는 방식이 익숙하다</li>
        <li>뽑는 자리가 여럿이라 공고를 나눠 올리고 싶다</li></ul></div>
      <div class="fitbox no"><p class="ft">스탠다드가 맞습니다</p>
        <ul><li>기다리지 않고 <b>먼저 연락</b>하고 싶다</li>
        <li>인재 이름·연락처를 보고 고르고 싶다</li>
        <li>메인 화면과 검색 위쪽에 서고 싶다</li></ul>
        <a class="go" href="#">스탠다드 보기 ›</a></div>
    </div>
  </div>

  <div class="sec">
    <p class="h">받는 것</p>
    <ul class="feat">
      <li>공고 등록 무제한</li><li>이용권 기간 내내 게재</li>
      <li>지원자 이력서·연락처 열람</li><li>검색 결과 일반 노출</li>
      <li>지원자 알림</li><li>공고 수정·마감 자유</li>
    </ul>
  </div>

  <div class="sec">
    <p class="h">신청하면 이렇게 됩니다</p>
    <p class="hs">결제 모듈을 붙이기 전이라 무통장입금으로 받습니다. 입금이 확인되면 바로 적용됩니다.</p>
    <div class="steps">
      <div class="step"><span class="sn">1</span><p class="st">신청</p><p class="sd">기간을 고르고 입금자명을 적습니다</p></div>
      <div class="step"><span class="sn">2</span><p class="st">입금</p><p class="sd">안내된 계좌로 보내 주세요</p></div>
      <div class="step"><span class="sn">3</span><p class="st">확인</p><p class="sd">영업일 기준 하루 안에 확인합니다</p></div>
      <div class="step"><span class="sn">4</span><p class="st">적용</p><p class="sd">걸어 둔 공고가 기간 끝까지 늘어납니다</p></div>
    </div>
  </div>

  <div class="sec">
    <p class="h">기간 고르기</p>
    <p class="hs">길수록 하루 값이 내려갑니다. 이용 중에 다시 신청하면 남은 기간에 이어 붙습니다.</p>
    <div class="plist">
      <div class="pitem"><span class="l"><b>7일</b></span><span class="r"><b>19,000원</b><i>하루 2,714원</i></span></div>
      <div class="pitem"><span class="l"><b>15일</b></span><span class="r"><b>29,000원</b><i>하루 1,933원</i></span></div>
      <div class="pitem best"><span class="l"><b>30일</b><span class="bb">가장 많이 고릅니다</span></span><span class="r"><b>49,000원</b><i>하루 1,633원</i></span></div>
      <div class="pitem"><span class="l"><b>45일</b></span><span class="r"><b>69,000원</b><i>하루 1,533원</i></span></div>
      <div class="pitem"><span class="l"><b>60일</b></span><span class="r"><b>89,000원</b><i>하루 1,483원</i></span></div>
    </div>
  </div>

  <div class="sec">
    <p class="h">자주 묻는 질문</p>
    <div class="qa"><dl>
      <dt>언제부터 시작되나요?</dt><dd>입금이 확인된 날부터 셉니다. 이용 중에 다시 신청하시면 남은 기간 뒤에 이어 붙습니다.</dd>
      <dt>이미 올려 둔 공고는 어떻게 되나요?</dt><dd>걸려 있는 공고의 게재 기간이 이용권 끝나는 날까지 함께 늘어납니다. 다시 올리실 필요 없습니다.</dd>
      <dt>기간이 끝나면 어떻게 되나요?</dt><dd>스타트로 돌아가고 걸려 있던 공고는 게재가 끝납니다. <b>자동 결제는 없습니다</b> — 끝나는 날 알림을 보내드립니다.</dd>
      <dt>환불이 되나요?</dt><dd>이용권을 쓰지 않은 상태에서 7일 안에 요청하시면 전액 환불합니다. 쓰신 뒤에는 남은 기간만큼 일할 계산합니다.</dd>
      <dt>세금계산서를 받을 수 있나요?</dt><dd>발행해 드립니다. 신청 후 고객센터로 사업자등록증을 보내 주세요.</dd>
      <dt>인재 검색도 되나요?</dt><dd>라이트에는 없습니다. 인재 이름·연락처 열람과 제안하기는 스탠다드부터입니다.</dd>
    </dl></div>
  </div>
</div>
<div class="stick">
  <span class="s">선착순 오픈 기념<b>첫 달 무료</b></span>
  <a class="cta" href="#">라이트 신청하기 →</a>
</div>`;
</script>
