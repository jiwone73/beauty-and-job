<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>공고카드 기업명 시안</title>
<style>
body{font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;background:#f7f7f8;margin:0;padding:28px;color:#555}
h1{font-size:17px;font-weight:600;margin:0 0 4px}
.sub{font-size:13px;color:#8a8a90;margin:0 0 24px}
.row{display:flex;gap:18px;flex-wrap:wrap}
.opt{width:250px}
.optname{font-size:13px;font-weight:600;color:#582681;margin:0 0 2px}
.optdesc{font-size:12px;color:#8a8a90;margin:0 0 8px;line-height:1.45;min-height:32px}
.jobcard{background:#fff;border:1px solid #eee;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.jobcard-cover{position:relative;aspect-ratio:16/10;overflow:hidden;background:#f7f7f8}
.jobcard-cover img{width:100%;height:100%;object-fit:cover;display:block}
.jobcard-body{padding:6px 14px 7px}
.jobcard-title{margin:0 0 3px;font-size:13px;font-weight:600;color:#1a1a1a;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.jobcard-company{margin:0 0 2px;font-size:13px;color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jobcard-metarow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:1px}
.jobcard-meta{margin:0;flex:1;min-width:0;font-size:13px;color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jobcard-deadline{font-size:12px;font-weight:600;color:#0f6e56;flex:none}
/* A — 흰 알약 */
.pill{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px);background:#fff;border-radius:100px;
  padding:3px 9px;font-size:11.5px;font-weight:600;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* B — 옅은 그라데이션 */
.scrim{position:absolute;left:0;right:0;bottom:0;padding:16px 10px 7px;
  background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,0));
  font-size:12px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h{height:0}
</style></head><body>
<h1>공고카드에 기업 이름 넣기</h1>
<p class="sub">넷 다 카드 높이는 지금과 같습니다. 사진 칸 16:10, 본문 세 줄 그대로.</p>
<div class="row" id="row"></div>
<script>
const IMG="https://iglvjgyjanvxeyuqurko.supabase.co/storage/v1/object/public/job-images/external/1789277789972-ke2chl.jpg";
const T="▶교육·성장·브랜딩까지 체계적 시스템 ｜정착지원금 최대 330만원｜드로시아 다산본점◀";
const CO="드로시아 다산점", CAT="헤어 디자이너 · 헤어 스텝", META="경기 남양주 · 경력무관";
const opts=[
 ["지금","기업 이름이 아예 없습니다. 둘째 줄은 모집분야입니다.",
  `<div class="jobcard-cover"><img src="${IMG}"></div><div class="jobcard-body">
   <p class="jobcard-title">${T}</p><p class="jobcard-company">${CAT}</p>
   <div class="jobcard-metarow"><p class="jobcard-meta">${META}</p><span class="jobcard-deadline">상시채용</span></div></div>`],
 ["A. 사진 위 흰 알약","사진 왼쪽 아래. 글줄을 하나도 안 뺏습니다. 사진이 밝으면 알약 테두리가 흐려질 수 있습니다.",
  `<div class="jobcard-cover"><img src="${IMG}"><span class="pill">${CO}</span></div><div class="jobcard-body">
   <p class="jobcard-title">${T}</p><p class="jobcard-company">${CAT}</p>
   <div class="jobcard-metarow"><p class="jobcard-meta">${META}</p><span class="jobcard-deadline">상시채용</span></div></div>`],
 ["B. 사진 아래 그늘","사진 아래쪽에 옅은 그늘을 깔고 흰 글씨. 어떤 사진에서도 읽히지만 카드마다 어두운 띠가 하나씩 생깁니다.",
  `<div class="jobcard-cover"><img src="${IMG}"><span class="scrim">${CO}</span></div><div class="jobcard-body">
   <p class="jobcard-title">${T}</p><p class="jobcard-company">${CAT}</p>
   <div class="jobcard-metarow"><p class="jobcard-meta">${META}</p><span class="jobcard-deadline">상시채용</span></div></div>`],
 ["C. 맨 아랫줄 앞에","기업 이름 · 지역 · 경력을 한 줄에. 사진은 안 건드리지만 줄이 길어져 경력이 잘릴 수 있습니다.",
  `<div class="jobcard-cover"><img src="${IMG}"></div><div class="jobcard-body">
   <p class="jobcard-title">${T}</p><p class="jobcard-company">${CAT}</p>
   <div class="jobcard-metarow"><p class="jobcard-meta">${CO} · ${META}</p><span class="jobcard-deadline">상시채용</span></div></div>`],
 ["D. 둘째 줄을 합쳐","기업 이름 · 모집분야. 모집분야가 둘 이상이면 뒤가 잘립니다.",
  `<div class="jobcard-cover"><img src="${IMG}"></div><div class="jobcard-body">
   <p class="jobcard-title">${T}</p><p class="jobcard-company">${CO} · ${CAT}</p>
   <div class="jobcard-metarow"><p class="jobcard-meta">${META}</p><span class="jobcard-deadline">상시채용</span></div></div>`],
];
document.getElementById('row').innerHTML = opts.map(([n,d,h])=>
 `<div class="opt"><p class="optname">${n}</p><p class="optdesc">${d}</p><div class="jobcard">${h}</div></div>`).join('');
</script></body></html>
